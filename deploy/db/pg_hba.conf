# Autenticação do PostgreSQL de produção.
# Socket local: só o usuário do sistema operacional do próprio contêiner (peer).
# Rede: apenas a sub-rede interna do Compose, sempre com senha (scram-sha-256).
# Nada de "trust" e nada de 0.0.0.0/0.

# TYPE  DATABASE  USER  ADDRESS         METHOD
local   all       all                   peer
host    all       all   172.28.0.0/24   scram-sha-256
