# Produção e homologação. Uso:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Regras (login.md, seção 10):
#   - somente o proxy publica portas (80 e 443);
#   - banco e backend vivem numa rede interna, sem acesso à internet;
#   - nenhum serviço é privilegiado, monta o socket do Docker ou usa a rede do host.

x-endurecimento: &endurecimento
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *endurecimento
    image: postgres:17.6-alpine
    # O superusuário só existe para a criação inicial; a API nunca o usa.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_SENHA:?Defina POSTGRES_SUPERUSER_SENHA}
      POSTGRES_DB: ${POSTGRES_DB:-armadilhas}
      DB_MIGRADOR_SENHA: ${DB_MIGRADOR_SENHA:?Defina DB_MIGRADOR_SENHA}
      DB_APP_SENHA: ${DB_APP_SENHA:?Defina DB_APP_SENHA}
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "listen_addresses=*"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
      - /run/postgresql
    # O entrypoint ajusta donos e troca de usuário na primeira execução.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      interna:
        ipv4_address: 172.28.0.10

  migracao:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trapsight_migrador:${DB_MIGRADOR_SENHA}@db:5432/${POSTGRES_DB:-armadilhas}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    mem_limit: 512m
    networks:
      - interna

  backend:
    <<: *endurecimento
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migracao:
        condition: service_completed_successfully
    environment:
      AMBIENTE: producao
      DATABASE_URL: postgresql://trapsight_app:${DB_APP_SENHA}@db:5432/${POSTGRES_DB:-armadilhas}
      MODEL_WEIGHTS_PATH: /app/models/checkpoints/latest.pt
      MODEL_VERSION: ${MODEL_VERSION:-v0.1.0-dev}
      INFERENCE_MODE: modelo
      INFERENCE_THREADS: ${INFERENCE_THREADS:-1}
      UPLOADS_DIR: /app/data/uploads
      CORS_ORIGENS: ${CORS_ORIGENS:?Defina CORS_ORIGENS (https://seu-dominio)}
      FORWARDED_ALLOW_IPS: 172.28.0.2
      SESSAO_INATIVIDADE_SEGUNDOS: ${SESSAO_INATIVIDADE_SEGUNDOS:-1800}
      SESSAO_DURACAO_MAXIMA_SEGUNDOS: ${SESSAO_DURACAO_MAXIMA_SEGUNDOS:-28800}
      LOGIN_FALHAS_POR_CONTA: ${LOGIN_FALHAS_POR_CONTA:-5}
      LOGIN_FALHAS_POR_IP: ${LOGIN_FALHAS_POR_IP:-30}
      ANALISES_POR_MINUTO: ${ANALISES_POR_MINUTO:-30}
    command:
      - python
      - -m
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --no-server-header
      - --no-access-log
    volumes:
      - uploads:/app/data/uploads
      - ./models/checkpoints:/app/models/checkpoints:ro
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - interna

  proxy:
    <<: *endurecimento
    build:
      context: .
      dockerfile: deploy/proxy/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Defina SITE_ADDRESS (domínio público)}
      CADDY_OPCOES_GLOBAIS: ${CADDY_OPCOES_GLOBAIS:-}
    ports:
      - "${PROXY_HTTP_PORTA:-80}:80"
      - "${PROXY_HTTPS_PORTA:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    # Usuário sem privilégios escutando em 80 e 443: o sysctl libera as portas baixas
    # somente no espaço de rede deste contêiner, sem nenhuma capacidade extra.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    mem_limit: 256m
    cpus: 0.5
    networks:
      publica:
        # O nome público também resolve dentro das redes do Compose, o que permite
        # ao executor de testes alcançar o proxy pelo mesmo endereço do navegador.
        aliases:
          - ${SITE_ADDRESS}
      interna:
        ipv4_address: 172.28.0.2
        aliases:
          - ${SITE_ADDRESS}

networks:
  # Sem rota para a internet: banco e backend nunca iniciam conexões externas.
  interna:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Os endereços fixos (db e proxy) ficam fora da faixa dinâmica.
          ip_range: 172.28.0.128/25
  publica: {}

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
