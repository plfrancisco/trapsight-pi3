[project]
name = "armadilhas-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2,<1",
    "Pillow>=11,<13",
    "psycopg[binary]>=3,<4",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.15.0,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.54.0,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8,<10",
    "ruff>=0.16.8",
]
treino = [
    "rembg[cpu]>=2.0",
    "albumentations>=2.0",
    "opencv-python-headless>=4.10,<5",
    "segmentation-models-pytorch>=0.5",
    "torch>=2.7",
    "torchmetrics>=1.6",
    "torchvision>=0.22",
]
baseline = ["opencv-python-headless>=4.10,<5"]

# No Windows o PyTorch vem do índice com CUDA; nas demais plataformas, do PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
